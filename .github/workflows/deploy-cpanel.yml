name: Deploy Bionora to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  build-and-deploy:
    name: Build & Deploy Vite/React to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html tidak ditemukan!"
            exit 1
          fi
          echo "Build sukses. Ukuran folder dist:"
          du -sh dist

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Akun FTP deployer-bionora sudah terkunci langsung ke folder /bionora.my.id
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: dist/
          dangerous-clean-slate: false
          timeout: 60000
